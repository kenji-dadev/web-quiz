name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat <<EOF > .env.production
          NODE_ENV=production
          EOF

      - name: Detect Docker Compose command
        id: dc
        run: |
          if docker compose version > /dev/null 2>&1; then
            echo "cmd=docker compose" >> "$GITHUB_OUTPUT"
          elif docker-compose version > /dev/null 2>&1; then
            echo "cmd=docker-compose" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Neither 'docker compose' nor 'docker-compose' found!"
            exit 1
          fi

      - name: Build and start containers
        run: |
          ${{ steps.dc.outputs.cmd }} -f docker-compose.prod.yml down --remove-orphans || true
          ${{ steps.dc.outputs.cmd }} -f docker-compose.prod.yml build --no-cache
          ${{ steps.dc.outputs.cmd }} -f docker-compose.prod.yml up -d

      - name: Prune old Docker images
        run: docker image prune -f

      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 5
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ App is healthy!"
              exit 0
            fi
            echo "Attempt $i/10 - waiting..."
            sleep 3
          done
          echo "❌ Health check failed"
          exit 1
          
